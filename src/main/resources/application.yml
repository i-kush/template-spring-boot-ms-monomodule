server:
  port: 8080
  http2:
    enabled: true

spring:
  application:
    name: replace-me-be-app
  threads:
    virtual:
      enabled: true

  data:
    redis:
      repositories:
        enabled: false
      ttl: 3 # hours
  jpa:
    open-in-view: false
  liquibase:
    change-log: classpath:/db.changelog/changelog-master.xml

management:
  server:
    port: 8081
  observations:
    annotations:
      enabled: true
  endpoints:
    web:
      exposure:
        include: health,metrics
  endpoint:
    health:
      show-details: ALWAYS
  metrics:
    tags:
      app: ${spring.application.name}

logging:
  level:
    com.kush.replaceme: INFO
    org.springframework.data.convert.CustomConversions: ERROR

replaceme:
  executor:
    async:
      core-size: 20
      max-size: 40
      queue-capacity: 200