name: ReplaceMe App Build

on:
  pull_request:
  push:
    branches: [ main ]

permissions:
  pull-requests: write
  checks: write

jobs:
  build:
    name: Build and Analysis
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 25
        uses: actions/setup-java@v5
        with:
          distribution: 'zulu'
          java-version: '25'

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-
      - name: Build and Check
        run: ./gradlew build --no-daemon

      - name: Code coverage report decoration
        id: jacoco
        uses: madrapps/jacoco-report@v1.7.2
        with:
          paths: ${{ github.workspace }}/**/build/reports/jacoco/test/jacocoTestReport.xml
          token: ${{ secrets.GITHUB_TOKEN }}
          min-coverage-overall: 90
          min-coverage-changed-files: 90
          title: 'Code Coverage'
          update-comment: 'true'
          pass-emoji: ':green_circle:'
          fail-emoji: ':red_circle:'

      - name: Code coverage report check
        if: ${{ steps.jacoco.outputs.coverage-changed-files < 90.0 || steps.jacoco.outputs.coverage-overall < 90.0 }}
        uses: actions/github-script@v6
        with:
          script: |
            core.setFailed('Changed files coverage is less than expected, see reports for details')